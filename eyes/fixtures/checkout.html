<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kirana Express · Checkout</title>
<meta name="eyes-task" content="Choose express delivery and continue to payment" />
<meta name="eyes-success" content="title:Payment" />
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #fbf7f2; color: #2a2118; }
  header { padding: 14px 28px; background: #c2410c; color: #fff; font-weight: 700; }
  main { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; padding: 24px; max-width: 1100px; margin: auto; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, select, textarea { width: 100%; padding: 9px; border: 1px solid #ddd2c4; border-radius: 8px; font: inherit; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .opt { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-weight: 500; }
  .opt input { width: auto; }
  button { margin-top: 16px; padding: 11px 18px; border: 0; border-radius: 8px; background: #c2410c; color: #fff; font: 600 15px system-ui; cursor: pointer; width: 100%; }
  .line { display: flex; justify-content: space-between; margin: 6px 0; }
</style>
</head>
<body>
<header>Kirana Express</header>
<main>
  <section class="card">
    <h2>Delivery details</h2>
    <div class="grid">
      <div><label for="fn">Full name</label><input id="fn" name="fullname" autocomplete="name" value="Rohan Iyer" data-truth="NAME" /></div>
      <div><label for="ph">Mobile number</label><input id="ph" name="mobile" type="tel" value="9123456789" data-truth="PHONE" /></div>
    </div>
    <label for="ad">Address</label>
    <input id="ad" name="address" autocomplete="street-address" value="Flat 12B, Lotus Residency, MG Road, Pune" data-truth="ADDRESS" />
    <div class="grid">
      <div><label for="pin">PIN code</label><input id="pin" name="pincode" autocomplete="postal-code" value="411001" data-truth="PINCODE" /></div>
      <div><label for="em">Email for receipt</label><input id="em" name="email" type="email" value="rohan.iyer@example.net" data-truth="EMAIL" /></div>
    </div>
    <h3>Delivery speed</h3>
    <label class="opt"><input type="radio" name="speed" value="standard" checked /> Standard (2–3 days) · free</label>
    <label class="opt"><input type="radio" name="speed" value="express" data-truth-ui="Express" /> Express (today) · ₹49</label>
    <label for="note">Note for the rider</label>
    <textarea id="note" rows="2" data-truth="PHONE" data-truth-span="9988776655">Call me at 9988776655 when you reach the gate</textarea>
  </section>
  <section class="card">
    <h2>Order summary</h2>
    <div class="line"><span>Basmati rice 5 kg</span><span>₹649</span></div>
    <div class="line"><span>Toor dal 1 kg</span><span>₹172</span></div>
    <div class="line"><span>Order #KX-2026-10-19-0042</span><span></span></div>
    <div class="line"><b>Total</b><b id="total">₹821</b></div>
    <button id="go" data-truth-ui="Continue to payment">Continue to payment</button>
  </section>
</main>
<script>
  document.querySelectorAll('input[name=speed]').forEach((r) => r.addEventListener('change', () => {
    document.getElementById('total').textContent = r.value === 'express' && r.checked ? '₹870' : '₹821'
  }))
  document.getElementById('go').addEventListener('click', () => {
    const express = document.querySelector('input[value=express]').checked
    document.title = express ? 'Payment' : 'Payment (standard delivery)'
    document.querySelector('.card h2').textContent = express ? 'Payment: express delivery chosen' : 'Payment'
  })
</script>
</body>
</html>
