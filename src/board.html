<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws://localhost:*" />
    <title>Manyaki</title>
    <link rel="stylesheet" href="./ui/board.css" />
  </head>
  <body>
    <header id="bar">
      <h1 id="title"></h1>
      <button id="close" type="button" aria-label="Close the board">✕</button>
    </header>
    <main id="board" aria-live="polite"></main>
    <form id="ask" autocomplete="off">
      <input id="question" maxlength="500" aria-label="Ask Manyaki about this" placeholder="Ask anything about this…" />
      <button type="submit">Ask</button>
    </form>
    <script type="module" src="./ui/board.ts"></script>
  </body>
</html>
